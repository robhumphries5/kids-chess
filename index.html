<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
    <meta name="theme-color" content="#7fb069" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icon-180.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Chess" />
    <title>Kids Chess</title>
  </head>
  <body>
    <button id="mute" class="mute-button" type="button"></button>
    <button id="corner" class="corner-button" type="button" hidden></button>
    <div id="profile-badge" class="profile-badge" role="img" hidden></div>
    <div id="star-jar" class="star-jar" role="img" hidden></div>
    <main class="app">
      <section id="menu" class="menu-screen" hidden>
        <div id="menu-choices" class="menu-choices"></div>
        <p id="menu-message" class="message" aria-live="polite"></p>
      </section>
      <section id="grown-up" class="grown-up-area" hidden></section>
      <section id="sticker-book" class="sticker-book-screen" hidden></section>
      <section id="game" class="game-screen" hidden>
        <div class="board-wrap"><div id="board"></div></div>
        <p id="message" class="message" aria-live="polite"></p>
        <div id="game-controls" class="game-controls" hidden></div>
      </section>
    </main>
    <button id="grown-up-button" class="grown-up-button" type="button" aria-label="Grown-ups: hold for 3 seconds" hidden>
      <span class="grown-up-fill" aria-hidden="true"></span><span class="grown-up-icon" aria-hidden="true">🔒</span>
    </button>
    <button id="go" class="go-button" type="button" aria-label="Go" hidden>Go ▶</button>
    <div id="overlay" class="overlay" hidden></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
